name: Plane Sync

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches: [$default-branch]

jobs:
  plane-sync:
    uses: gOOvER/.github/.github/workflows/plane-sync.yml@main
    with:
      plane_base_url: "https://plane.goover.dev"
      # Optional direkt hier eintragen (UUID, kurzes Kürzel wie "GGE", Projektname oder leer für Auto-Match per Repo-Namen):
      # plane_workspace_slug: "goover"
      # plane_project_id: "GGE"
    secrets:
      PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
      PLANE_WORKSPACE_SLUG: ${{ secrets.PLANE_WORKSPACE_SLUG }}
      PLANE_PROJECT_ID: ${{ secrets.PLANE_PROJECT_ID }}
