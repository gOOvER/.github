name: Plane Sync

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches: [$default-branch]

jobs:
  plane-sync:
    uses: gOOvER/.github/.github/workflows/plane-sync.yml@main
    with:
      plane_base_url: "https://plane.goover.dev"
      # Optional direkt hier eintragen oder als Repository-Secret hinterlegen:
      # plane_workspace_slug: "goover"
      # plane_project_id: "00000000-0000-0000-0000-000000000000"
    secrets:
      PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
      PLANE_WORKSPACE_SLUG: ${{ secrets.PLANE_WORKSPACE_SLUG }}
      PLANE_PROJECT_ID: ${{ secrets.PLANE_PROJECT_ID }}
